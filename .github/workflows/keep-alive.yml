name: keep-alive

# Render's free web service sleeps after ~15 min without traffic. Pinging the health
# endpoint every 10 minutes keeps brandcast-tv awake. Scheduled workflows only run from
# the default branch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://brandcast-tv.onrender.com/api/health
