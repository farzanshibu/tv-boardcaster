name: keep-alive

# Render's free web service sleeps after ~15 min without traffic. Pinging the health
# endpoint every 10 minutes during demo hours (04:00-15:59 UTC, 09:30-21:29 IST) keeps brandcast-tv awake while staying inside the 750 free hours shared with foodos-services. Scheduled workflows only run from
# the default branch.
on:
  schedule:
    - cron: "*/10 4-15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://brandcast-tv.onrender.com/api/health
