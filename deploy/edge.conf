# Caching edge in front of MinIO — the CDN's job, runnable locally.
#
# Nothing here decides how long anything is cached: the objects carry their own
# Cache-Control (segments a year and immutable, playlists a few seconds), so the edge
# only has to honour it. That keeps one policy in one place, in src/lib/storage.ts.

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media:64m
                 max_size=5g inactive=7d use_temp_path=off;

server {
  listen 80;
  server_name _;

  # Media objects are large; buffering them to disk before the first byte reaches a
  # TV would add startup latency to every segment.
  proxy_buffering on;
  proxy_max_temp_file_size 0;

  location / {
    proxy_pass http://minio:9000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;

    proxy_cache media;
    # One in-flight fetch per object: a store full of screens starting together must
    # not become a stampede on the origin.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    # Keep serving the last good copy if the origin is briefly unreachable.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;

    add_header X-Cache-Status $upstream_cache_status always;
    # HLS is fetched by XHR, so the player needs CORS on every segment.
    add_header Access-Control-Allow-Origin "*" always;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
