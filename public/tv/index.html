<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brandcast TV — Player</title>
<style>
  :root { --bg:#000; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; cursor:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity .6s ease; display:flex; align-items:center; justify-content:center; background:#000; }
  .slide.active { opacity:1; }
  .slide img, .slide video, .slide iframe { width:100%; height:100%; object-fit:contain; border:0; }

  /* pairing screen */
  #pair { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:radial-gradient(circle at 50% 40%,#1e293b,#020617); gap:2vh; text-align:center; }
  .brand { font-size:2.6vw; letter-spacing:.4em; text-transform:uppercase; color:#38bdf8; font-weight:700; }
  .hint { font-size:1.5vw; color:#94a3b8; max-width:60vw; line-height:1.6; }
  .code { font-size:16vw; font-weight:800; letter-spacing:1.5vw; color:#fff; text-shadow:0 0 60px rgba(56,189,248,.6);
          font-variant-numeric:tabular-nums; }
  .timer { font-size:2vw; color:#facc15; font-variant-numeric:tabular-nums; }
  .meta { position:fixed; bottom:2vh; font-size:1vw; color:#475569; }

  /* ticker */
  #ticker { position:fixed; left:0; right:0; height:8vh; display:none; align-items:center; overflow:hidden; z-index:20; }
  #ticker.top { top:0; } #ticker.bottom { bottom:0; }
  #tickerText { white-space:nowrap; font-size:4vh; padding-left:100vw; animation:scroll linear infinite; font-weight:600; }
  @keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-100%); } }

  #badge { position:fixed; top:1.5vh; right:1.5vh; z-index:30; font-size:1.4vh; padding:.6vh 1.2vh; border-radius:99px;
           background:rgba(2,6,23,.75); border:1px solid #1e293b; color:#94a3b8; display:flex; gap:.8vh; align-items:center; }
  .dot { width:1vh; height:1vh; border-radius:50%; background:#22c55e; }
  .dot.off { background:#ef4444; } .dot.cache { background:#f59e0b; }
  #empty { text-align:center; color:#64748b; font-size:2vw; }
  body.portrait #stage { transform:rotate(90deg); }
</style>
</head>
<body>

<div id="pair" role="status" aria-live="polite" aria-label="Screen pairing">
  <div class="brand">Brandcast TV</div>
  <div class="hint">Enter this code in your Brandcast dashboard to pair this screen.</div>
  <div class="code" id="code" aria-label="Pairing code">----</div>
  <div class="timer" id="timer" aria-label="Time remaining">3:00</div>
  <div class="meta" id="meta"></div>
</div>

<div id="stage" hidden><div id="empty" hidden>No content assigned to this screen yet.</div></div>
<div id="ticker"><div id="tickerText"></div></div>
<div id="badge" hidden><span class="dot" id="dot"></span><span id="badgeText">Online</span></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const API = location.origin;
  const LS = {
    device: 'bc_device_id', token: 'bc_device_token',
    screen: 'bc_screen_id', payload: 'bc_payload',
  };

  let deviceId = localStorage.getItem(LS.device);
  if (!deviceId) { deviceId = 'dev_' + Math.random().toString(36).slice(2, 12); localStorage.setItem(LS.device, deviceId); }
  let token = localStorage.getItem(LS.token);
  let ws = null, payload = null, slideTimer = null, pollTimer = null, hbTimer = null, otpTimer = null;
  let lastPublishId = null, online = false;

  const metadata = () => ({
    resolution: `${screen.width}x${screen.height}`,
    orientation: screen.width >= screen.height ? 'landscape' : 'portrait',
    os_type: /Tizen/i.test(navigator.userAgent) ? 'tizen'
           : /Web0S|LG/i.test(navigator.userAgent) ? 'webos'
           : /Android/i.test(navigator.userAgent) ? 'androidtv' : 'web',
    app_version: '1.0.0',
  });

  const setBadge = (state, text) => {
    $('badge').hidden = false;
    $('dot').className = 'dot' + (state === 'online' ? '' : state === 'cache' ? ' cache' : ' off');
    $('badgeText').textContent = text;
  };

  /* ---------------- pairing ---------------- */
  async function startPairing() {
    $('pair').style.display = 'flex';
    $('stage').hidden = true; $('ticker').style.display = 'none'; $('badge').hidden = true;
    clearInterval(otpTimer); clearInterval(pollTimer);
    $('meta').textContent = `Device ${deviceId} · ${metadata().resolution} · ${metadata().os_type}`;
    try {
      const r = await fetch(`${API}/api/pairing/generate-otp`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId, metadata: metadata() }),
      });
      const data = await r.json();
      $('code').textContent = data.code;
      let left = data.expires_in_seconds;
      const tick = () => {
        $('timer').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
        if (left-- <= 0) { clearInterval(otpTimer); clearInterval(pollTimer); startPairing(); }
      };
      tick(); otpTimer = setInterval(tick, 1000);

      pollTimer = setInterval(async () => {
        const s = await fetch(`${API}/api/pairing/status/${data.code}?device_id=${encodeURIComponent(deviceId)}`)
            .then((x) => x.json()).catch(() => null);
        if (s?.status === 'paired') {
          clearInterval(pollTimer); clearInterval(otpTimer);
          token = s.device_token;
          localStorage.setItem(LS.token, token);
          localStorage.setItem(LS.screen, s.screen_id);
          connect();
        }
      }, 2000);
    } catch {
      $('code').textContent = '----';
      $('timer').textContent = 'No connection — retrying';
      setTimeout(startPairing, 5000);
    }
  }

  /* ---------------- realtime session ---------------- */
  function connect() {
    if (!token) return startPairing();
    $('pair').style.display = 'none';
    $('stage').hidden = false;

    const cached = localStorage.getItem(LS.payload);
    if (cached && !payload) { render(JSON.parse(cached)); setBadge('cache', 'Offline · cached'); }

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/device/session?token=${encodeURIComponent(token)}`);

    ws.onopen = () => {
      online = true;
      setBadge('online', 'Online');
      clearInterval(hbTimer);
      hbTimer = setInterval(() => {
        if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'heartbeat', ...metadata() }));
      }, 20000);
    };

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'content') {
        lastPublishId = msg.publish_id;
        localStorage.setItem(LS.payload, JSON.stringify(msg.payload));
        render(msg.payload);
        if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'ack', publish_id: msg.publish_id }));
        setBadge('online', 'Online · synced');
      }
      if (msg.type === 'unpaired') {
        localStorage.removeItem(LS.token); localStorage.removeItem(LS.payload);
        token = null; payload = null; ws.close(); startPairing();
      }
    };

    ws.onclose = () => {
      online = false; clearInterval(hbTimer);
      if (!token) return;
      setBadge('cache', 'Offline · playing cache');
      setTimeout(connect, 4000);            // auto reconnect + delta sync on reopen
    };
    ws.onerror = () => ws.close();
  }

  /* ---------------- rendering ---------------- */
  function render(p) {
    payload = p;
    document.body.classList.toggle('portrait', p.screen?.orientation === 'portrait');

    const stage = $('stage');
    stage.querySelectorAll('.slide').forEach((n) => n.remove());
    clearTimeout(slideTimer);

    const items = p.playlist?.items || [];
    $('empty').hidden = items.length > 0;

    // ticker
    const t = p.ticker;
    const bar = $('ticker');
    if (t) {
      bar.style.display = 'flex';
      bar.className = t.position === 'top' ? 'top' : 'bottom';
      bar.style.background = t.background;
      $('tickerText').style.color = t.color;
      $('tickerText').textContent = t.text;
      $('tickerText').style.animationDuration = `${Math.max(8, 6000 / (t.speed || 60))}s`;
    } else bar.style.display = 'none';

    if (!items.length) return;

    const slides = items.map((item) => {
      const div = document.createElement('div');
      div.className = 'slide';
      if (item.type === 'video') {
        const v = document.createElement('video');
        v.src = item.url; v.muted = true; v.loop = false; v.playsInline = true; v.preload = 'auto';
        div.appendChild(v);
      } else if (item.type === 'html') {
        const f = document.createElement('iframe');
        f.src = item.url; f.setAttribute('sandbox', 'allow-scripts allow-same-origin');
        div.appendChild(f);
      } else {
        const img = document.createElement('img');
        img.src = item.url; img.loading = 'eager';
        img.onerror = () => ws?.readyState === 1 && ws.send(JSON.stringify({ type: 'error', detail: `media_load_failed:${item.media_id}` }));
        div.appendChild(img);
      }
      stage.appendChild(div);
      return { div, item };
    });

    let i = -1;
    const advance = () => {
      if (i >= 0) slides[i].div.classList.remove('active');
      i = (i + 1) % slides.length;
      const { div, item } = slides[i];
      div.classList.add('active');
      const v = div.querySelector('video');
      if (v) { v.currentTime = 0; v.play().catch(() => {}); }
      if (ws?.readyState === 1)
        ws.send(JSON.stringify({ type: 'play', media_id: item.media_id, playlist_id: p.playlist.id, duration: item.duration }));
      slideTimer = setTimeout(advance, (item.duration || 10) * 1000);
    };
    advance();
  }

  // periodic catch-up fetch in case a push was missed while briefly offline
  setInterval(async () => {
    if (!token || online) return;
    try {
      const r = await fetch(`${API}/api/device/content`, { headers: { authorization: `Bearer ${token}` } });
      if (r.ok) { const p = await r.json(); localStorage.setItem(LS.payload, JSON.stringify(p)); render(p); }
    } catch {}
  }, 30000);

  token ? connect() : startPairing();
})();
</script>
</body>
</html>
